<section class="card">
  <h1>Connexion</h1>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>Email
      <input
        type="email"
        formControlName="email"
        autocomplete="email"
        [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
      />
    </label>
    @if (hasError('email', 'required')) { <small class="error">L’email est obligatoire.</small> }
    @if (hasError('email', 'email')) { <small class="error">Format d’email invalide.</small> }

    <label>Mot de passe
      <input
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
      />
    </label>
    @if (hasError('password', 'required')) { <small class="error">Le mot de passe est obligatoire.</small> }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Connexion…' : 'Se connecter' }}
    </button>
  </form>
  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }
  <p><a routerLink="/register">Créer un compte</a></p>
</section>
